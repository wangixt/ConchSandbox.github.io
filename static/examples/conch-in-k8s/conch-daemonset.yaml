apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: conch
  namespace: conch-system
spec:
  selector:
    matchLabels: {app: conch}
  template:
    metadata:
      labels: {app: conch}
    spec:
      hostNetwork: false
      dnsPolicy: ClusterFirst
      hostAliases:
        - ip: 10.0.0.10
          hostnames: [hub.conch.com]
      nodeSelector:
        conch.io/kvm: "true"
      containers:
        - name: conchd
          image: hub.conch.com:5000/conch/conch-engine:v0.1-x86_64
          command: ["sh", "-c", "rm -f /var/run/conch/conchd.pid /var/run/conch/conchd.sock && exec conchd --config /etc/conch/config.yaml"]
          resources:
            limits:
              conch.io/kvm: "1"
            requests:
              conch.io/kvm: "1"
          securityContext:
            privileged: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN, SYS_ADMIN]
            seccompProfile: {type: Unconfined}
            appArmorProfile: {type: Unconfined}
          volumeMounts:
            - {name: run, mountPath: /var/run/conch}
            - {name: state, mountPath: /var/lib/conch}
            - {name: deploy, mountPath: /opt/conch/deploy, readOnly: true}
      volumes:
        - name: run
          hostPath:
            path: /var/run/conch
            type: DirectoryOrCreate
        - name: state
          hostPath:
            path: /var/lib/conch
            type: DirectoryOrCreate
        - name: deploy
          hostPath:
            path: /opt/conch/deploy
            type: Directory
